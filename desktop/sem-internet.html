<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sem internet</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #f4f2ee; font: 16px system-ui, sans-serif; text-align: center; }
  button { margin-top: 18px; padding: 10px 22px; border: 0; border-radius: 8px; background: #f4f2ee; color: #0a0a0a; font-size: 15px; cursor: pointer; }
  p { color: #a3a3a3; }
</style>
</head>
<body>
  <div>
    <h2>Sem conexão com o sistema</h2>
    <p>Confira a internet e tente de novo.</p>
    <button onclick="location.href = new URLSearchParams(location.search).get('voltar')">Tentar de novo</button>
  </div>
</body>
</html>
